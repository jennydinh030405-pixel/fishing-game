<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sustainability Fishing Game</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; margin: 0; padding: 0; }
    body { background: #0b192c; color: #f1f5f9; min-height: 100vh; overflow-x: hidden; }
    button { cursor: pointer; border: none; border-radius: 8px; font-weight: 700; transition: 0.15s; }
    button:hover { opacity: 0.92; transform: translateY(-1px); }
    button:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
    input[type="number"] { background: #0f172a; color: #38bdf8; border: 1px solid #475569; border-radius: 6px; text-align: center; font-weight: 800; }

    .topbar { display: flex; justify-content: space-between; align-items: center; padding: 10px 20px; background: #1e293b; border-bottom: 2px solid #334155; flex-wrap: wrap; gap: 10px; }
    .controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13px; }
    .badge { padding: 6px 12px; border-radius: 99px; font-weight: 700; background: #0f172a; border: 1px solid #334155; }
    .timer-badge { padding: 6px 14px; border-radius: 99px; font-weight: 900; font-size: 16px; background: #7c2d12; color: #fed7aa; border: 2px solid #f97316; }
    .btn-primary { background: #0284c7; color: white; padding: 8px 14px; font-size: 13px; }
    .btn-amber { background: #d97706; color: white; padding: 8px 14px; font-size: 13px; }
    .btn-green { background: #16a34a; color: white; padding: 9px 16px; font-size: 14px; }
    .btn-danger { background: #dc2626; color: white; padding: 8px 12px; font-size: 13px; }
    .btn-ghost { background: #334155; color: #e2e8f0; padding: 6px 10px; font-size: 12px; }

    .subbar { background: #0f172a; padding: 8px 20px; text-align: center; border-bottom: 1px solid #1e293b; font-size: 15px; font-weight: 700; color: #38bdf8; }

    .arena { position: relative; width: 980px; height: 640px; margin: 8px auto; user-select: none; }
    #arenaCanvas { position: absolute; top: 0; left: 0; width: 980px; height: 640px; z-index: 5; pointer-events: none; }

    .pond-ring { position: absolute; top: 330px; left: 490px; transform: translate(-50%, -50%); width: 340px; height: 340px; border-radius: 50%; border: 8px solid #22c55e; box-shadow: 0 0 45px rgba(56, 189, 248, 0.28); pointer-events: none; z-index: 4; transition: 0.4s; }
    .pond-overlay { position: absolute; top: 330px; left: 490px; transform: translate(-50%, -50%); pointer-events: none; text-align: center; z-index: 6; text-shadow: 0 2px 10px rgba(0,0,0,0.95); }
    .pond-count { font-size: 52px; font-weight: 900; line-height: 1; color: #ffffff; }
    .pond-zone { font-size: 12px; font-weight: 700; margin-top: 6px; padding: 4px 12px; border-radius: 12px; background: rgba(15, 23, 42, 0.82); border: 1px solid rgba(255,255,255,0.15); display: inline-block; }

    .team-card { position: absolute; width: 235px; background: rgba(30, 41, 59, 0.95); border: 2px solid #475569; border-radius: 14px; padding: 10px 12px; text-align: center; box-shadow: 0 8px 20px rgba(0,0,0,0.5); z-index: 10; }
    .team-card.locked { border-color: #22c55e; box-shadow: 0 0 16px rgba(34, 197, 94, 0.35); }
    .pos-1 { top: 4px; left: 490px; transform: translateX(-50%); }
    .pos-2 { top: 155px; right: 8px; }
    .pos-3 { bottom: 12px; right: 75px; }
    .pos-4 { bottom: 12px; left: 75px; }
    .pos-5 { top: 155px; left: 8px; }
    .team-title { font-weight: 800; font-size: 15px; margin-bottom: 3px; display: flex; justify-content: space-between; align-items: center; }
    .team-status { font-size: 16px; font-weight: 900; margin: 3px 0; color: #38bdf8; }
    .host-manual { display: flex; justify-content: center; align-items: center; gap: 4px; margin: 5px 0; background: #0f172a; padding: 4px; border-radius: 8px; }
    .btn-mini { width: 25px; height: 25px; background: #334155; color: white; font-size: 12px; border-radius: 6px; }
    .team-basket { background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 5px 6px; margin-top: 5px; min-height: 44px; text-align: left; }
    .basket-header { font-size: 11px; color: #94a3b8; display: flex; justify-content: space-between; margin-bottom: 2px; }
    .basket-icons { font-size: 14px; line-height: 1.25; word-break: break-all; max-height: 36px; overflow-y: auto; }

    .tracker-grid { max-width: 980px; margin: 0 auto 20px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; padding: 0 10px; }
    .round-box { background: #1e293b; border: 2px solid #334155; border-radius: 12px; padding: 10px 14px; font-size: 13px; }
    .round-box.active { border-color: #38bdf8; background: #172554; }
    .round-box h4 { font-size: 14px; margin-bottom: 4px; color: #f8fafc; display: flex; justify-content: space-between; }

    .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.82); display: none; align-items: center; justify-content: center; z-index: 100; padding: 20px; }
    .modal.active { display: flex; }
    .modal-box { background: #1e293b; border: 2px solid #475569; border-radius: 16px; padding: 24px; max-width: 850px; width: 100%; text-align: center; }
    .qr-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin: 20px 0; }
    .qr-item { background: #0f172a; padding: 12px 8px; border-radius: 10px; border: 1px solid #334155; }
    .qr-item img { width: 120px; height: 120px; border-radius: 8px; background: white; padding: 6px; margin: 8px 0; }

    .phone-view { max-width: 420px; margin: 25px auto; background: #1e293b; border-radius: 20px; padding: 24px 18px; text-align: center; border: 2px solid #38bdf8; box-shadow: 0 12px 30px rgba(0,0,0,0.5); }
    .ctrl-row { display: flex; justify-content: center; align-items: center; gap: 10px; margin: 18px 0; }
    .btn-step { width: 48px; height: 48px; font-size: 18px; background: #334155; color: white; border-radius: 12px; }
    .phone-input { width: 110px; height: 56px; font-size: 32px; }
  </style>
</head>
<body>

  <!-- PROJECTOR HOST VIEW (Sichtbar beim Laden!) -->
  <div id="hostView">
    <div class="topbar">
      <div style="display:flex; align-items:center; gap:12px;">
        <strong style="font-size:17px;">🐟 Commons Fishing Simulator</strong>
        <span class="badge">Round <span id="roundNum">1</span> / 3</span>
        <span class="timer-badge" id="hostTimer">⏱️ 60s</span>
      </div>

      <div class="controls">
        <label style="color:#94a3b8;">Start Fish:</label>
        <input type="number" id="initFishInput" value="50" min="5" max="500" style="width:60px; padding:5px;">
        <button class="btn-ghost" onclick="setCustomFish()">Set Pool</button>
        <button id="secretBtn" class="btn-ghost" onclick="toggleSecretMode()">🔒 Mode: Secret (??)</button>
        <button class="btn-amber" onclick="start60sTimer()">⏱️ Start 60s Timer</button>
        <button class="btn-primary" onclick="toggleQR(true)">📱 5 QR Codes</button>
        <button id="actionBtn" class="btn-green" onclick="runRoundAction()">🎣 Execute Harvest</button>
        <button class="btn-danger" onclick="resetGame()">↺ Reset</button>
      </div>
    </div>

    <div class="subbar" id="bannerMsg">Round 1: Click "Start 60s Timer" or let groups enter their catch!</div>

    <div class="arena">
      <canvas id="arenaCanvas" width="980" height="640"></canvas>
      <div class="pond-ring" id="pondRing"></div>

      <div class="pond-overlay">
        <div class="pond-count" id="fishCountTxt">50</div>
        <div style="font-size:12px; font-weight:800;">FISH IN POOL (MAX <span id="maxFishTxt">50</span>)</div>
        <div class="pond-zone" id="zoneTxt">🟢 Round 1 Growth: +50% Births</div>
      </div>

      <div class="team-card pos-1" id="card-1">Group 1</div>
      <div class="team-card pos-2" id="card-2">Group 2</div>
      <div class="team-card pos-3" id="card-3">Group 3</div>
      <div class="team-card pos-4" id="card-4">Group 4</div>
      <div class="team-card pos-5" id="card-5">Group 5</div>
    </div>

    <div class="tracker-grid">
      <div class="round-box active" id="rbox-1">
        <h4><span>Round 1: High Growth</span> <span style="color:#4ade80;">+50% Birth Rate</span></h4>
